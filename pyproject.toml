[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "provida-assistant"
version = "1.0.0"
description = "Local-first English Windows desktop voice assistant"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6==6.8.3", "vosk==0.3.45", "sounddevice==0.5.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.8", "pyinstaller>=6.11"]

[project.scripts]
provida = "provida.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
